name: Bug Report
description: File a bug report to help us improve Windows Power Explorer
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 
        Before you submit, please check if a similar issue already exists.

  - type: input
    id: version
    attributes:
      label: Windows Power Explorer Version
      description: What version of WPE are you using? (e.g., 1.0.0, main branch)
      placeholder: e.g. v1.0.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows OS Version & Build
      description: What version/build of Windows 10/11 are you running? (e.g., Windows 11 22H2 22621.1702)
      placeholder: e.g. Windows 11 Pro 22H2
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python Version
      description: If running from source, what Python version are you using? (Leave blank if using the standalone .exe)
      placeholder: e.g. 3.11.4
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Please provide clear steps to reproduce the behavior.
      value: |
        1. Open Windows Power Explorer
        2. Go to '...'
        3. Click on '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs or Crash Dumps
      description: Paste any relevant logs, stack traces, or terminal output here. (Please use code blocks ```).
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Validation
      options:
        - label: I have searched the existing issues to make sure this bug has not already been reported.
          required: true
        - label: I have provided all the required information to the best of my ability.
          required: true
